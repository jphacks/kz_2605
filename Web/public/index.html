<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a2140">
  <title>童話配信</title>
  <meta name="description" content="VRで絵本の世界に入った体験者を、リアルタイムで見守り、物語の選択肢に投票できる配信ページ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">童話配信</span>
      <span class="brand-sub">え！本当に… 絵本の世界へ</span>
    </div>
    <div class="status">
      <span id="live-badge" class="live-badge offline">準備中</span>
      <span class="viewers">視聴者 <b id="viewer-count">0</b>人</span>
      <button id="share-button" class="share-button" type="button">スマホで見る</button>
    </div>
  </header>

  <div id="share" class="share" hidden>
    <div id="share-qr" class="share-qr"></div>
    <div>
      <p class="share-text">スマホでQRコードを読み取るか、このアドレスを開いてください。</p>
      <p id="share-url" class="share-url"></p>
    </div>
  </div>

  <main class="layout">
    <section class="stage">
      <div class="book">
        <div class="book-page">
          <div class="screen">
            <img id="frame" alt="体験者が見ている絵本の世界">
            <div id="screen-empty" class="screen-empty">絵本がひらくのを待っています…</div>
            <div id="screen-danmaku" class="screen-danmaku" aria-hidden="true"></div>
            <div id="screen-reactions" class="screen-reactions" aria-hidden="true"></div>
            <div id="area-name" class="area-name"></div>
          </div>
          <p id="subtitle" class="subtitle"><span class="subtitle-idle">― 物語はまだ始まっていません ―</span></p>
        </div>
      </div>

      <!-- リアクション：押すと体験者のVR視界にも浮かぶ（種類は app.js の REACTIONS） -->
      <div id="reactions" class="reactions" role="group" aria-label="リアクション"></div>

      <div id="thanks" class="thanks" hidden>
        <p class="thanks-main">ご視聴ありがとうございました。</p>
        <p id="thanks-sub" class="thanks-sub">配信は終了しました。また絵本の世界でお会いしましょう。</p>
      </div>

      <div id="ending" class="ending" hidden>
        <div class="ending-label">おしまい</div>
        <div id="ending-title" class="ending-title"></div>
        <div id="ending-genre" class="ending-genre"></div>
      </div>
      <section id="feedback" class="card feedback" hidden aria-labelledby="feedback-title">
        <h2 id="feedback-title" class="card-title">物語はいかがでしたか？</h2>
        <p>感想をタップして、ひとこと残してね。物語が終わったあとも送れます。</p>
        <div class="feedback-ratings" role="group" aria-label="物語の感想">
          <button type="button" data-rating="good" aria-pressed="false">👍 よかった</button>
          <button type="button" data-rating="bad" aria-pressed="false">💭 いまひとつ</button>
        </div>
        <form id="feedback-form" class="feedback-form">
          <label for="feedback-text">感想コメント</label>
          <textarea id="feedback-text" maxlength="60" rows="2" placeholder="よかったところ、気になったところ（60文字まで）" required></textarea>
          <button type="submit">感想を送る</button>
        </form>
        <p id="feedback-status" role="status" aria-live="polite"></p>
      </section>
    </section>

    <aside class="side">
      <section id="choice" class="card choice" aria-label="現在の投票">
        <div class="choice-head">
          <span id="choice-status" class="choice-label" role="status">現在の投票 · 待機中</span>
          <span id="choice-timer" class="choice-timer"></span>
        </div>
        <h2 id="choice-question" class="choice-question">物語の選択肢が出ると、ここで投票できます</h2>
        <div id="choice-timebar" class="timebar"><div></div></div>
        <div id="choice-options" class="options"></div>
        <p id="choice-note" class="choice-note">好きな選択肢を1つタップして投票。締め切りまで変更できます。</p>
      </section>

      <section class="card comments">
        <h2 class="card-title">コメント</h2>
        <!-- 映像を見ながら書けるよう、入力欄は一覧の上に置く（新しいコメントは入力欄のすぐ下に出る） -->
        <form id="comment-form" class="comment-form" autocomplete="off">
          <input id="comment-name" class="name-input" maxlength="20" placeholder="なまえ">
          <input id="comment-text" class="text-input" maxlength="60" placeholder="コメントする（選択肢の名前で1票）" required>
          <button type="submit">送る</button>
        </form>
        <ul id="comment-list" class="comment-list"></ul>
      </section>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
